<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ascend">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Ascend</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Character creation, shown once -->
  <div id="onboarding" class="screen"></div>

  <!-- Main app, hidden until a character exists -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <span class="wordmark">ASCEND</span>
    </header>

    <main class="views">
      <section id="view-home" class="view"></section>
      <section id="view-quests" class="view hidden"></section>
      <section id="view-stats" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
    </main>

    <nav class="bottomnav">
      <button class="navbtn active" data-view="home" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg>
        <span>Home</span>
      </button>
      <button class="navbtn" data-view="quests" aria-label="Quests">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h1.5M4 12h1.5M4 17.5h1.5"/><path d="M9 6.5h11M9 12h11M9 17.5h11"/></svg>
        <span>Quests</span>
      </button>
      <button class="navbtn" data-view="stats" aria-label="Stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
        <span>Stats</span>
      </button>
      <button class="navbtn" data-view="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11"/><circle cx="18" cy="7" r="2"/><path d="M13 12h7"/><circle cx="8" cy="12" r="2"/><path d="M4 17h11"/><circle cx="18" cy="17" r="2"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- Add / edit quest modal -->
  <div id="quest-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h2 id="quest-modal-title">New quest</h2>
        <button class="icon-btn" id="quest-modal-close" aria-label="Close"></button>
      </div>

      <label class="field">
        <span>Title</span>
        <input id="quest-title" type="text" maxlength="60" placeholder="e.g. Read 20 pages">
      </label>

      <label class="field">
        <span>Frequency</span>
        <select id="quest-frequency">
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </label>

      <label class="field">
        <span>Category</span>
        <select id="quest-category">
          <option value="body">Body</option>
          <option value="mind">Mind</option>
          <option value="discipline">Discipline</option>
          <option value="spirit">Spirit</option>
          <option value="other">Other</option>
        </select>
      </label>

      <label class="field">
        <span>XP reward</span>
        <input id="quest-xp" type="number" min="1" max="999" step="1">
      </label>

      <div class="modal-actions">
        <button class="btn-ghost" id="quest-delete-btn" style="display:none">Delete</button>
        <button class="btn-primary" id="quest-save-btn">Save quest</button>
      </div>
    </div>
  </div>

  <!-- Level up celebration -->
  <div id="levelup-modal" class="modal-overlay hidden">
    <div class="modal levelup-modal">
      <div class="levelup-badge">
        <svg viewBox="0 0 200 200" class="hex hex-big">
          <polygon points="100,12 176.2,56 176.2,144 100,188 23.8,144 23.8,56" />
        </svg>
        <div class="levelup-number" id="levelup-number">2</div>
      </div>
      <div class="levelup-caption">Level up</div>
      <div class="levelup-title" id="levelup-title">Soldier</div>
      <button class="btn-primary" id="levelup-continue">Continue</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
